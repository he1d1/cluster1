---
clusterName: cluster1
talosVersion: v1.11.5
kubernetesVersion: v1.34.1
endpoint: https://kube.cluster1.internal.heidi.codes:6443
domain: cluster1.internal.heidi.codes
allowSchedulingOnMasters: true
additionalMachineCertSans:
  - 192.168.1.21
  - 192.168.1.22
  - 192.168.1.23
  - kube.cluster1.internal.heidi.codes
clusterPodNets:
  - 10.244.0.0/16
clusterSvcNets:
  - 10.96.0.0/12
nodes:
  - hostname: pi1
    ipAddress: 192.168.1.21
    controlPlane: true
    installDisk: /dev/mmcblk0
    machineSpec:
      arch: arm64
      mode: metal
    schematic:
      overlay:
        name: rpi_generic
        image: siderolabs/sbc-raspberrypi
      customization:
        systemExtensions:
          officialExtensions:
            - siderolabs/vc4
            - siderolabs/iscsi-tools
            - siderolabs/util-linux-tools
        kernelModules:
          - name: br_netfilter
  - hostname: pi2
    ipAddress: 192.168.1.22
    controlPlane: true
    installDisk: /dev/mmcblk0
    machineSpec:
      arch: arm64
      mode: metal
    schematic:
      overlay:
        name: rpi_generic
        image: siderolabs/sbc-raspberrypi
      customization:
        systemExtensions:
          officialExtensions:
            - siderolabs/vc4
            - siderolabs/iscsi-tools
            - siderolabs/util-linux-tools
        kernelModules:
          - name: br_netfilter
  - hostname: pi3
    ipAddress: 192.168.1.23
    controlPlane: true
    installDisk: /dev/mmcblk0
    machineSpec:
      arch: arm64
      mode: metal
    schematic:
      overlay:
        name: rpi_generic
        image: siderolabs/sbc-raspberrypi
      customization:
        systemExtensions:
          officialExtensions:
            - siderolabs/vc4
            - siderolabs/iscsi-tools
            - siderolabs/util-linux-tools
        kernelModules:
          - name: br_netfilter
controlPlane:
  patches:
    - |-
      machine:
        network:
          interfaces:
            - interface: end0
              dhcp: true
    - op: remove
      path: /machine/nodeLabels/node.kubernetes.io~1exclude-from-external-load-balancers
