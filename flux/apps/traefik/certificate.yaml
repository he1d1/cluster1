apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cluster1-wildcard
  namespace: traefik
spec:
  secretName: cluster1-wildcard-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - "*.apps.cluster1.internal.heidi.codes"
    - "apps.cluster1.internal.heidi.codes"
