apiVersion: v1
kind: ConfigMap
metadata:
  name: blocky-config
data:
  config.yml: |
    upstreams:
      groups:
        default:
          - https://dns.cloudflare.com/dns-query
          - https://dns.google/dns-query
    customDNS:
      mapping:
        # Cluster services (all go to Traefik)
        cluster1.internal.heidi.codes: 192.168.1.100
        test.cluster1.internal.heidi.codes: 192.168.1.100
        # Add more services here as needed:
        # app.cluster1.internal.heidi.codes: 192.168.1.100
    ports:
      dns: 53
      http: 4000
    log:
      level: info
