---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "67.4.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
  install:
    createNamespace: true
    crds: Create
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    timeout: 15m
    remediation:
      retries: 3
  values:
    # Reduce resource usage for Raspberry Pi cluster
    prometheus:
      prometheusSpec:
        retention: 7d
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi
        # Use persistent storage via Longhorn
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi

    alertmanager:
      alertmanagerSpec:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi

    grafana:
      adminPassword: admin # Change this or use SOPS secret
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
      # Increase startup time for slow Pi migrations
      livenessProbe:
        initialDelaySeconds: 120
        timeoutSeconds: 30
      readinessProbe:
        initialDelaySeconds: 60
        timeoutSeconds: 30
      persistence:
        enabled: true
        storageClassName: longhorn
        size: 5Gi
      additionalDataSources:
        - name: Loki
          type: loki
          url: http://loki:3100
          access: proxy
          isDefault: false
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: grafana-dashboards
              orgId: 1
              folder: ""
              type: file
              disableDeletion: false
              editable: true
              options:
                path: /var/lib/grafana/dashboards/grafana-dashboards
      dashboards:
        grafana-dashboards:
          node-exporter:
            gnetId: 1860
            revision: 37
            datasource: Prometheus
          kubernetes-views-global:
            gnetId: 15757
            revision: 42
            datasource: Prometheus
          kubernetes-views-pods:
            gnetId: 15760
            revision: 36
            datasource: Prometheus
          flux-cluster:
            gnetId: 16714
            revision: 2
            datasource: Prometheus
          longhorn:
            gnetId: 16888
            revision: 9
            datasource: Prometheus
          loki-logs:
            gnetId: 13639
            revision: 2
            datasource: Loki

    # Disable components not needed or too heavy for Pi cluster
    kubeEtcd:
      enabled: false # Talos manages etcd differently
    kubeControllerManager:
      enabled: false # Not accessible in Talos
    kubeScheduler:
      enabled: false # Not accessible in Talos
    kubeProxy:
      enabled: false # Talos uses kube-proxy differently

    # Node exporter for host metrics
    nodeExporter:
      operatingSystems:
        darwin:
          enabled: false
        aix:
          enabled: false
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi

    # Kube-state-metrics
    kube-state-metrics:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi

    # Prometheus Operator
    prometheusOperator:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
