---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nzbget-config
data:
  nzbget.conf: |
    # Directories
    MainDir=/downloads
    DestDir=${MainDir}/completed
    InterDir=${MainDir}/intermediate
    NzbDir=${MainDir}/nzb
    QueueDir=${MainDir}/queue
    TempDir=${MainDir}/tmp
    ScriptDir=/app/nzbget/scripts

    # Newshosting Server
    Server1.Active=yes
    Server1.Name=Newshosting
    Server1.Host=news.newshosting.com
    Server1.Port=563
    Server1.Username=74z67niu5
    Server1.Password=${NEWSHOSTING_PASSWORD}
    Server1.Encryption=yes
    Server1.Connections=30
    Server1.Retention=5800
    Server1.Level=0
    Server1.Group=0

    # Categories
    Category1.Name=sonarr
    Category1.DestDir=${MainDir}/completed/sonarr
    Category2.Name=radarr
    Category2.DestDir=${MainDir}/completed/radarr
    Category3.Name=prowlarr
    Category3.DestDir=${MainDir}/completed/prowlarr

    # Security
    ControlUsername=nzbget
    ControlPassword=${NZBGET_PASSWORD}
    AuthorizedIP=
    DaemonUsername=

    # Download settings
    ArticleTimeout=60
    UrlTimeout=60
    RemoteTimeout=90
    WriteBuffer=1024
    ArticleCache=256
    DirectWrite=yes
    ContinuePartial=yes

    # Logging
    WriteLog=append
    RotateLog=3
    LogBuffer=1000
    NzbLog=yes
    DetailTarget=log
    InfoTarget=log
    WarningTarget=both
    ErrorTarget=both
    DebugTarget=none

    # Scheduler (empty)

    # Check and Repair
    ParCheck=auto
    ParRepair=yes
    ParScan=extended
    ParQuick=yes
    ParBuffer=256
    ParThreads=0
    ParRename=yes

    # Unpack
    Unpack=yes
    DirectUnpack=yes
    UnpackPauseQueue=no
    UnrarCmd=unrar
    SevenZipCmd=7z

    # Permissions
    UMask=0000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nzbget
  labels:
    app: nzbget
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nzbget
  template:
    metadata:
      labels:
        app: nzbget
    spec:
      dnsPolicy: "None"
      dnsConfig:
        nameservers:
          - "1.1.1.1"
          - "8.8.8.8"
        searches:
          - media.svc.cluster.local
          - svc.cluster.local
          - cluster.local
      initContainers:
        - name: init-config
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              cp /config-template/nzbget.conf /config/nzbget.conf
              sed -i "s/\${NEWSHOSTING_PASSWORD}/$NEWSHOSTING_PASSWORD/g" /config/nzbget.conf
              sed -i "s/\${NZBGET_PASSWORD}/$NZBGET_PASSWORD/g" /config/nzbget.conf
          env:
            - name: NEWSHOSTING_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nzbget-secrets
                  key: newshosting-password
            - name: NZBGET_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nzbget-secrets
                  key: nzbget-password
          volumeMounts:
            - name: config-template
              mountPath: /config-template
            - name: config
              mountPath: /config
      containers:
        - name: nzbget
          image: lscr.io/linuxserver/nzbget:latest
          ports:
            - containerPort: 6789
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "UTC"
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /downloads
      volumes:
        - name: config-template
          configMap:
            name: nzbget-config
        - name: config
          emptyDir: {}
        - name: downloads
          persistentVolumeClaim:
            claimName: downloads
---
apiVersion: v1
kind: Service
metadata:
  name: nzbget
spec:
  selector:
    app: nzbget
  ports:
    - port: 80
      targetPort: 6789
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nzbget
spec:
  parentRefs:
    - name: traefik
      namespace: traefik
      sectionName: websecure
  hostnames:
    - nzbget.apps.cluster1.internal.heidi.codes
  rules:
    - backendRefs:
        - name: nzbget
          port: 80
