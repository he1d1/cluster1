---
apiVersion: v1
kind: ConfigMap
metadata:
  name: buildarr-config
data:
  buildarr.yml: |
    buildarr:
      watch_config: true
      update_days:
        - monday
        - tuesday
        - wednesday
        - thursday
        - friday
        - saturday
        - sunday
      update_times:
        - "03:00"

    prowlarr:
      hostname: prowlarr.apps.cluster1.internal.heidi.codes
      port: 443
      protocol: https
      settings:
        indexers:
          indexers:
            definitions:
              NZBGeek:
                type: newznab
                enable: true
                sync_profile: Standard
                redirect: false
                priority: 25
                url: https://api.nzbgeek.info
                api_path: /api
                api_key: __NZBGEEK_API_KEY__
                categories:
                  - TV/WEB-DL
                  - TV/Foreign
                  - TV/SD
                  - TV/HD
                  - TV/UHD
                  - TV/Other
                  - Movies/Foreign
                  - Movies/Other
                  - Movies/SD
                  - Movies/HD
                  - Movies/UHD
                  - Movies/BluRay
                  - Movies/3D
                  - Movies/DVD
                  - Movies/WEB-DL
        apps:
          applications:
            definitions:
              Sonarr:
                type: sonarr
                prowlarr_sync: full-sync
                prowlarr_url: https://prowlarr.apps.cluster1.internal.heidi.codes
                base_url: https://sonarr.apps.cluster1.internal.heidi.codes
                instance_name: sonarr
                sync_categories:
                  - TV/WEB-DL
                  - TV/Foreign
                  - TV/SD
                  - TV/HD
                  - TV/UHD
                  - TV/Other
              Radarr:
                type: radarr
                prowlarr_sync: full-sync
                prowlarr_url: https://prowlarr.apps.cluster1.internal.heidi.codes
                base_url: https://radarr.apps.cluster1.internal.heidi.codes
                instance_name: radarr
                sync_categories:
                  - Movies/Foreign
                  - Movies/Other
                  - Movies/SD
                  - Movies/HD
                  - Movies/UHD
                  - Movies/BluRay
                  - Movies/3D
                  - Movies/DVD
                  - Movies/WEB-DL
        download_clients:
          definitions:
            NZBGet:
              type: nzbget
              enable: true
              host: nzbget.apps.cluster1.internal.heidi.codes
              port: 443
              use_ssl: true
              username: nzbget
              password: __NZBGET_PASSWORD__
              category: prowlarr
              priority: 50

    sonarr:
      hostname: sonarr.apps.cluster1.internal.heidi.codes
      port: 443
      protocol: https
      settings:
        media_management:
          root_folders:
            definitions:
              - /media/tv
        download_clients:
          definitions:
            NZBGet:
              type: nzbget
              enable: true
              host: nzbget.apps.cluster1.internal.heidi.codes
              port: 443
              use_ssl: true
              username: nzbget
              password: __NZBGET_PASSWORD__
              category: sonarr
              priority: 50

    radarr:
      hostname: radarr.apps.cluster1.internal.heidi.codes
      port: 443
      protocol: https
      settings:
        media_management:
          root_folders:
            definitions:
              - /media/movies
        download_clients:
          definitions:
            NZBGet:
              type: nzbget
              enable: true
              hostname: nzbget.apps.cluster1.internal.heidi.codes
              port: 443
              use_ssl: true
              username: nzbget
              password: __NZBGET_PASSWORD__
              category: radarr
              priority: 50
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildarr
  labels:
    app: buildarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: buildarr
  template:
    metadata:
      labels:
        app: buildarr
    spec:
      dnsPolicy: "None"
      dnsConfig:
        nameservers:
          - "1.1.1.1"
          - "8.8.8.8"
        searches:
          - media.svc.cluster.local
          - svc.cluster.local
          - cluster.local
      initContainers:
        - name: init-config
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              cp /config-template/buildarr.yml /config/buildarr.yml
              sed -i "s/__NZBGEEK_API_KEY__/$NZBGEEK_API_KEY/g" /config/buildarr.yml
              sed -i "s/__NZBGET_PASSWORD__/$NZBGET_PASSWORD/g" /config/buildarr.yml
          env:
            - name: NZBGEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: buildarr-secrets
                  key: nzbgeek-api-key
            - name: NZBGET_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: buildarr-secrets
                  key: nzbget-password
          volumeMounts:
            - name: config-template
              mountPath: /config-template
            - name: config
              mountPath: /config
      containers:
        - name: buildarr
          image: callum027/buildarr:latest
          args: ["daemon", "/config/buildarr.yml"]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config-template
          configMap:
            name: buildarr-config
        - name: config
          emptyDir: {}
