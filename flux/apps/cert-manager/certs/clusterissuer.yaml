apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    email: heidi+letsencrypt@heidi.codes
    server: https://acme-v02.api.letsencrypt.org/directory
    skipTLSVerify: true
    privateKeySecretRef:
      name: letsencrypt-traefik
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token
          cnameStrategy: Follow
