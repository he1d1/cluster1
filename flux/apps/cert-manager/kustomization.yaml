---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: cert-manager
resources:
- namespace.yaml
- ocirepository.yaml
- helmrelease.yaml
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: certs
resources:
- clusterissuer.yaml
spec:
  path: ./certs
  dependsOn:
    - name: cert-manager
