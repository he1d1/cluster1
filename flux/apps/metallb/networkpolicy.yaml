---
# Allow MetalLB speaker pods to communicate for leader election
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metallb-speaker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: speaker
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow memberlist communication between speakers
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: metallb-system
          podSelector:
            matchLabels:
              app.kubernetes.io/component: speaker
      ports:
        - protocol: TCP
          port: 7946
        - protocol: UDP
          port: 7946
  egress:
    # Allow memberlist communication
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: metallb-system
          podSelector:
            matchLabels:
              app.kubernetes.io/component: speaker
      ports:
        - protocol: TCP
          port: 7946
        - protocol: UDP
          port: 7946
    # Allow communication with Kubernetes API
    - to:
        - ipBlock:
            cidr: 10.96.0.0/12
      ports:
        - protocol: TCP
          port: 443
---
# Allow MetalLB controller
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metallb-controller
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: controller
  policyTypes:
    - Egress
  egress:
    # Allow communication with Kubernetes API
    - to:
        - ipBlock:
            cidr: 10.96.0.0/12
      ports:
        - protocol: TCP
          port: 443
