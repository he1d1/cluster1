apiVersion: v1
kind: Service
metadata:
  name: test-service
  namespace: metallb-system
spec:
  type: LoadBalancer
  selector:
    app: test
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: test-pod
  labels:
    app: test
    namespace: metallb-system
spec:
  containers:
  - name: nginx
    image: nginx:latest
    ports:
    - containerPort: 8080
